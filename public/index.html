  <style>
    /* Stops the white flash between the loader and the first paint */
    html,
    body {
      background: #0d1b24;
      margin: 0;
    }

    html[data-theme="day"] body {
      background: #05abe0;
    }
  </style>
  <script>
    // Apply the saved/system theme before React mounts, so there is no flash.
    (function () {
      try {
        var s = localStorage.getItem('theme');
        var night = s ? s === 'night' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', night ? 'night' : 'day');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'day'); }
    })();
  </script>
</head>
